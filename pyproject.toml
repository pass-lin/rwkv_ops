[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rwkv-ops"
version = "0.4.0"
authors = [
    { name = "pass-lin", email = "qw_lin@qq.com" },
]
description = "RWKV operators for multiple backends (PyTorch, JAX, Keras)"
readme = "README.md"
license = { text = "Apache-2.0" }  # 改为文本许可证，不使用文件
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "keras>=3.0"
]

[project.urls]
"Homepage" = "https://github.com/pass-lin/rwkv_ops"

[tool.hatch.build.targets.wheel]
packages = [
    "rwkv_ops",
    "rwkv_ops.rwkv6_kernel", 
    "rwkv_ops.rwkv7_kernel"
]